name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Download FFmpeg for Windows
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-download
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          $ffmpeg = Get-ChildItem ffmpeg-download -Filter ffmpeg.exe -Recurse -File | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe was not found in archive' }
          Copy-Item $ffmpeg.FullName bin/ffmpeg.exe
          Copy-Item (Join-Path $ffmpeg.DirectoryName 'ffprobe.exe') bin/ffprobe.exe
      - name: Build Windows desktop app
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name SyncForge syncforge.py
      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/SyncForge/bin -Force | Out-Null
          Copy-Item bin/ffmpeg.exe dist/SyncForge/bin/ffmpeg.exe
          Copy-Item bin/ffprobe.exe dist/SyncForge/bin/ffprobe.exe
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: SyncForge-Windows
          path: dist/SyncForge/
          if-no-files-found: error
