name: Test and Build SyncForge Windows

on:
  push:
    branches: [main, ui-refresh-v3]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 50
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download FFmpeg and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-download
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          $ffmpeg = Get-ChildItem ffmpeg-download -Filter ffmpeg.exe -Recurse -File | Select-Object -First 1
          if (-not $ffmpeg) { throw 'FFmpeg binary missing from archive' }
          Copy-Item $ffmpeg.FullName bin/ffmpeg.exe
          Copy-Item (Join-Path $ffmpeg.DirectoryName 'ffprobe.exe') bin/ffprobe.exe
          & bin/ffmpeg.exe -version | Select-Object -First 1
          & bin/ffprobe.exe -version | Select-Object -First 1

      - name: Check Python syntax
        run: python -m compileall -q syncforge_studio.py syncforge_core.py tests

      - name: Test matching, exports, and Qt interface
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Package modern Windows desktop app
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name SyncForge syncforge_studio.py

      - name: Include local FFmpeg and FFprobe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/SyncForge/bin -Force | Out-Null
          Copy-Item bin/ffmpeg.exe dist/SyncForge/bin/ffmpeg.exe
          Copy-Item bin/ffprobe.exe dist/SyncForge/bin/ffprobe.exe

      - name: Smoke test packaged executable and UI
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $app = Start-Process -FilePath 'dist/SyncForge/SyncForge.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Bundled executable failed FFmpeg smoke test: $($app.ExitCode)" }
          $ui = Start-Process -FilePath 'dist/SyncForge/SyncForge.exe' -ArgumentList '--self-test-ui' -Wait -PassThru
          if ($ui.ExitCode -ne 0) { throw "Bundled Qt user interface failed to launch: $($ui.ExitCode)" }

      - name: Upload ready-to-run Windows application
        uses: actions/upload-artifact@v4
        with:
          name: SyncForge-Studio-v3-Windows
          path: dist/SyncForge/
          retention-days: 30
          if-no-files-found: error
